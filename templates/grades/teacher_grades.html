{% extends 'base.html' %}
{% block title %}{% endblock %}
{% block content %}
<div class="ph"><div class="ph-left"><h1>🏆 <span data-i18n="page-title-grades">Baholar</span></h1><p data-i18n="page-sub-grades">Kurs tanlang</p></div></div>
<div class="course-grid">
  {% for course in courses %}
  <a href="{% url 'course_grades' course.pk %}" class="course-card animate" style="animation-delay:{{ forloop.counter0 }}00ms;">
    <div class="cc-thumb" style="background:linear-gradient(135deg,#1e3a5f,#0d2137);">
      <span style="font-size:36px;">{{ course.emoji }}</span>
    </div>
    <div class="cc-body">
      <div class="cc-name">{{ course.name }}</div>
      <div class="cc-meta">{{ course.enrolled_count }} <span data-i18n="filter-student">talaba</span></div>
    </div>
  </a>
  {% empty %}
  <div class="empty"><div class="icon">📚</div><h3 data-i18n="empty-no-data">Kurslar yo'q</h3></div>
  {% endfor %}
</div>
{% endblock %}
